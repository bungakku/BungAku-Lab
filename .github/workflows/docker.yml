# Docker lane: builds docker/Dockerfile, starts the MariaDB service from docker-compose.yml and runs one check inside the lab container.
# It proves the container path works (image, compose, entrypoint); browsers are covered by lab.yml, so this lane uses Chromium only.
# Run it by hand (Actions > docker > Run workflow), for example after changing docker/*, docker-compose.yml, versions.env or package.json.
name: docker

on:
  workflow_dispatch:
    inputs:
      target:
        description: Target under targets/
        default: bungaku-theme
      ref:
        description: Git tag to test (or "latest")
        default: latest
      base:
        description: Previous tag for the parity suite (empty = skip parity)
        default: ""

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    name: docker compose / Chromium
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      LAB_BROWSERS: chromium
      TARGET: ${{ inputs.target || 'bungaku-theme' }}
      REF: ${{ inputs.ref || 'latest' }}
      BASE: ${{ inputs.base || '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker compose build lab
      - name: Doctor
        run: docker compose run --rm -T lab doctor
      - name: Check
        run: |
          args=()
          [ -n "$BASE" ] && args+=(--base "$BASE")
          docker compose run --rm -T lab check "$TARGET" "$REF" "${args[@]}"
      - name: Container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 80 db
